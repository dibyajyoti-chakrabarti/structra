name: Deploy Worker (Manual)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build, push, and update worker Lambda
    runs-on: ubuntu-latest

    env:
      ECR_REGISTRY: 190084967282.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
      FUNCTION_NAME: structra-prod-worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::190084967282:role/structra-github-OIDC-Role
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push worker image
        run: |
          docker build \
            -f worker/Dockerfile.lambda \
            -t $ECR_REGISTRY/structra-worker:latest \
            .
          docker push $ECR_REGISTRY/structra-worker:latest

      - name: Update Lambda function code
        run: |
          aws lambda update-function-code \
            --function-name $FUNCTION_NAME \
            --image-uri $ECR_REGISTRY/structra-worker:latest

      - name: Wait for Lambda update
        run: |
          aws lambda wait function-updated \
            --function-name $FUNCTION_NAME
          echo "Worker Lambda updated successfully."
