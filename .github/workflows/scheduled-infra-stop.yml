name: Scheduled - Stop Infra (9PM IST)

on:
  schedule:
    - cron: '30 15 * * *'  # 15:30 UTC = 21:00 IST
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  stop:
    name: Stop NAT EC2 and RDS
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::042843883108:role/structra-github-OIDC-Role
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Stop NAT EC2 if running
        run: |
          STATE=$(aws ec2 describe-instances \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
            --query "Reservations[0].Instances[0].State.Name" \
            --output text)
          echo "EC2 state: $STATE"
          if [ "$STATE" = "running" ]; then
            aws ec2 stop-instances --instance-ids ${{ secrets.EC2_INSTANCE_ID }}
            echo "NAT EC2 stop initiated."
          else
            echo "NAT EC2 is already $STATE — skipping."
          fi

      - name: Stop RDS if available
        run: |
          STATUS=$(aws rds describe-db-instances \
            --db-instance-identifier ${{ secrets.RDS_INSTANCE_ID }} \
            --query "DBInstances[0].DBInstanceStatus" \
            --output text)
          echo "RDS status: $STATUS"
          if [ "$STATUS" = "available" ]; then
            aws rds stop-db-instance --db-instance-identifier ${{ secrets.RDS_INSTANCE_ID }}
            echo "RDS stop initiated."
          else
            echo "RDS is already $STATUS — skipping."
          fi
