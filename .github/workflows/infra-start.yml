name: Infra Start (Manual)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  start:
    name: Start RDS and NAT EC2
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::190084967282:role/structra-github-OIDC-Role
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Start RDS
        run: |
          STATUS=$(aws rds describe-db-instances \
            --db-instance-identifier ${{ secrets.RDS_INSTANCE_ID }} \
            --query "DBInstances[0].DBInstanceStatus" \
            --output text)
          echo "RDS status: $STATUS"
          if [ "$STATUS" = "stopped" ]; then
            aws rds start-db-instance --db-instance-identifier ${{ secrets.RDS_INSTANCE_ID }}
            echo "RDS start initiated."
          else
            echo "RDS is already $STATUS — skipping."
          fi

      - name: Wait for RDS to be available
        run: |
          echo "Waiting for RDS to become available..."
          aws rds wait db-instance-available \
            --db-instance-identifier ${{ secrets.RDS_INSTANCE_ID }}
          echo "RDS is available."

      - name: Start NAT EC2
        run: |
          STATE=$(aws ec2 describe-instances \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
            --query "Reservations[0].Instances[0].State.Name" \
            --output text)
          echo "EC2 state: $STATE"
          if [ "$STATE" = "stopped" ]; then
            aws ec2 start-instances --instance-ids ${{ secrets.EC2_INSTANCE_ID }}
            echo "NAT EC2 start initiated."
          else
            echo "NAT EC2 is already $STATE — skipping."
          fi
