name: Deploy Backend (Manual)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build, push, and update backend Lambda
    runs-on: ubuntu-latest

    env:
      ECR_REGISTRY: 469465348250.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
      FUNCTION_NAME: structra-prod-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::469465348250:role/structra-github-OIDC-Role
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        run: |
          docker build \
            -f backend/Dockerfile.lambda \
            -t $ECR_REGISTRY/structra-api:latest \
            ./backend
          docker push $ECR_REGISTRY/structra-api:latest

      - name: Update Lambda function code
        run: |
          aws lambda update-function-code \
            --function-name $FUNCTION_NAME \
            --image-uri $ECR_REGISTRY/structra-api:latest

      - name: Wait for code update
        run: aws lambda wait function-updated --function-name $FUNCTION_NAME

      - name: Switch Lambda to migration handler
        run: |
          aws lambda update-function-configuration \
            --function-name $FUNCTION_NAME \
            --image-config '{"Command":["migrate_handler.handler"]}'

      - name: Wait for configuration update
        run: aws lambda wait function-updated --function-name $FUNCTION_NAME

      - name: Run migrations
        run: |
          aws lambda invoke \
            --function-name $FUNCTION_NAME \
            --cli-binary-format raw-in-base64-out \
            --payload '{}' \
            /tmp/migrate-result.json
          echo "Migration result:"
          cat /tmp/migrate-result.json
          grep -q '"status": "ok"' /tmp/migrate-result.json || (echo "Migration failed!" && exit 1)

      - name: Revert Lambda to API handler
        if: always()
        run: |
          aws lambda update-function-configuration \
            --function-name $FUNCTION_NAME \
            --image-config '{}'

      - name: Wait for revert
        if: always()
        run: |
          aws lambda wait function-updated --function-name $FUNCTION_NAME
          echo "Backend Lambda updated and migrations applied successfully."
