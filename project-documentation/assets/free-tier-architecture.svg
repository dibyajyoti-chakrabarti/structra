<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="t d" font-family="system-ui, sans-serif" font-size="12">
  <title id="t">Structra on free tiers</title>
  <desc id="d">The API and the evaluation worker run in one Render container and share one Neon Postgres database, which also holds the job queue.</desc>
  <style>
    :root { --bg:#ffffff; --ink:#0f172a; --muted:#64748b; --line:#94a3b8; --core:#2563eb; --core-fill:#dbeafe; --ext-fill:#f1f5f9; --gap:#b45309; --gap-fill:#fef3c7; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0f172a; --ink:#e2e8f0; --muted:#94a3b8; --line:#64748b; --core:#60a5fa; --core-fill:#1e3a8a; --ext-fill:#1e293b; --gap:#fbbf24; --gap-fill:#451a03; }
    }
    .bg { fill:var(--bg); }
    .box { fill:var(--ext-fill); stroke:var(--line); stroke-width:1.2; }
    .core { fill:var(--core-fill); stroke:var(--core); stroke-width:2; }
    .gap { fill:var(--gap-fill); stroke:var(--gap); stroke-width:1.5; stroke-dasharray:6 4; }
    .t { fill:var(--ink); font-weight:600; }
    .s { fill:var(--muted); font-size:11px; }
    .a { stroke:var(--line); stroke-width:1.3; fill:none; }
    .trunk { stroke:var(--core); stroke-width:3; fill:none; }
    .gapline { stroke:var(--gap); stroke-width:1.5; stroke-dasharray:6 4; fill:none; }
    .l { fill:var(--ink); font-size:11px; }
    .lg { fill:var(--gap); font-size:11px; }
  </style>
  <defs>
    <marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--line)"/></marker>
    <marker id="hc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--core)"/></marker>
    <marker id="hg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--gap)"/></marker>
  </defs>
  <rect class="bg" width="960" height="560"/>

  <!-- Browser and Cloudflare -->
  <rect class="box" x="30" y="40" width="190" height="64" rx="8"/>
  <text class="t" x="125" y="68" text-anchor="middle">Browser</text>
  <text class="s" x="125" y="88" text-anchor="middle">React 19, Vite 7, tokens in localStorage</text>

  <rect class="box" x="30" y="190" width="190" height="84" rx="8"/>
  <text class="t" x="125" y="216" text-anchor="middle">Cloudflare Pages</text>
  <text class="s" x="125" y="236" text-anchor="middle">structra.pages.dev (main)</text>
  <text class="s" x="125" y="252" text-anchor="middle">docs.structra.pages.dev (docs)</text>

  <rect class="box" x="30" y="400" width="190" height="84" rx="8"/>
  <text class="t" x="125" y="426" text-anchor="middle">Cloudflare Worker</text>
  <text class="s" x="125" y="446" text-anchor="middle">structra-keepalive</text>
  <text class="s" x="125" y="462" text-anchor="middle">cron */10 4-16 UTC</text>

  <path class="a" d="M125 104V190" marker-end="url(#h)"/>
  <text class="l" x="133" y="152">static assets, HTTPS</text>

  <!-- Render container -->
  <rect class="core" x="330" y="90" width="300" height="230" rx="10"/>
  <text class="t" x="480" y="114" text-anchor="middle">Render free web service, Singapore</text>
  <text class="s" x="480" y="130" text-anchor="middle">one Docker container, deploy/render/Dockerfile</text>
  <rect class="box" x="350" y="146" width="260" height="68" rx="6"/>
  <text class="t" x="480" y="170" text-anchor="middle">gunicorn, Django 6 and DRF</text>
  <text class="s" x="480" y="188" text-anchor="middle">1 worker, 4 threads, timeout 120 s</text>
  <text class="s" x="480" y="203" text-anchor="middle">own JWT auth, HS256, 15 min access</text>
  <rect class="box" x="350" y="228" width="260" height="76" rx="6"/>
  <text class="t" x="480" y="252" text-anchor="middle">evaluation worker</text>
  <text class="s" x="480" y="270" text-anchor="middle">python -m evaluation_worker</text>
  <text class="s" x="480" y="285" text-anchor="middle">USE_SQS=false, local transport</text>

  <path class="a" d="M220 100H330" marker-end="url(#h)"/>
  <text class="l" x="226" y="94">HTTPS, CORS, /api/</text>


  <path class="a" d="M220 442H300V300H330" marker-end="url(#h)"/>
  <text class="l" x="232" y="436">GET /api/health/, 90 s timeout</text>

  <!-- Neon Postgres: the load-bearing claim -->
  <rect class="core" x="330" y="440" width="300" height="84" rx="10"/>
  <text class="t" x="480" y="466" text-anchor="middle">Neon Postgres</text>
  <text class="s" x="480" y="484" text-anchor="middle">aws-ap-southeast-1, db structra, role structra_owner</text>
  <text class="s" x="480" y="500" text-anchor="middle">application data and the evaluation job queue</text>

  
  <path class="trunk" d="M440 304V440" marker-end="url(#hc)"/>
  <path class="trunk" d="M630 168H670V482H630" marker-end="url(#hc)"/>
  <text class="l" x="448" y="378" fill="var(--core)" style="fill:var(--core)">worker polls, TCP 5432, sslmode=require</text>
  <text class="l" x="664" y="400" text-anchor="end" style="fill:var(--core)">API reads and writes,</text>
  <text class="l" x="664" y="415" text-anchor="end" style="fill:var(--core)">same DB, TCP 5432</text>

  <!-- External services -->
  <rect class="box" x="760" y="40" width="170" height="56" rx="8"/>
  <text class="t" x="845" y="64" text-anchor="middle">Gmail API</text>
  <text class="s" x="845" y="82" text-anchor="middle">login codes, invitations</text>
  <path class="a" d="M630 120H700V68H760" marker-end="url(#h)"/>
  <text class="l" x="640" y="62">HTTPS, gmail.send</text>

  <rect class="box" x="760" y="116" width="170" height="56" rx="8"/>
  <text class="t" x="845" y="140" text-anchor="middle">Google, GitHub</text>
  <text class="s" x="845" y="158" text-anchor="middle">OAuth code flow with PKCE</text>
  <path class="a" d="M630 144H760" marker-end="url(#h)"/>

  <rect class="box" x="760" y="192" width="170" height="56" rx="8"/>
  <text class="t" x="845" y="216" text-anchor="middle">OpenRouter</text>
  <text class="s" x="845" y="234" text-anchor="middle">gemma-4-31b-it:free and fallbacks</text>
  <path class="a" d="M610 266H700V220H760" marker-end="url(#h)"/>
  <text class="l" x="616" y="282">LLM calls, HTTPS</text>

  <rect class="box" x="760" y="268" width="170" height="56" rx="8"/>
  <text class="t" x="845" y="292" text-anchor="middle">Razorpay, test mode</text>
  <text class="s" x="845" y="310" text-anchor="middle">Individual 299 INR, Team 349 INR</text>
  <path class="a" d="M630 190H720V296H760" marker-end="url(#h)"/>

  <rect class="gap" x="760" y="352" width="170" height="52" rx="8"/>
  <text class="t" x="845" y="374" text-anchor="middle">Razorpay webhook</text>
  <text class="lg" x="845" y="392" text-anchor="middle">missing: account not accessible</text>
  <path class="gapline" d="M760 378H640V300" marker-end="url(#hg)"/>

  <rect class="box" x="760" y="440" width="170" height="84" rx="8"/>
  <text class="t" x="845" y="466" text-anchor="middle">Neon storage bucket</text>
  <text class="s" x="845" y="484" text-anchor="middle">structra-assets, S3 compatible</text>
  <text class="s" x="845" y="500" text-anchor="middle">avatars, public read, R2_* names</text>

  <path class="a" d="M630 312H735V420H845V440" marker-end="url(#h)"/>
  <text class="l" x="742" y="416">presigned URLs, S3 API</text>

  <text class="s" x="30" y="548">Built from deploy/render/start.sh, deploy/render/Dockerfile, backend/config/settings/base.py, infra/free/*.tf. Branch free-tier-revival.</text>
</svg>
