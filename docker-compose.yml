services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: structra
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: structra_root
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env.local
    environment:
      DJANGO_ENV: local
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env.local
    environment:
      DJANGO_ENV: local
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

  docs:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./docs:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm start -- --host 0.0.0.0"

volumes:
  pgdata:
