name: Infra Stop (Disabled Until July)

on:
  workflow_dispatch:

jobs:
  time-guard:
    runs-on: ubuntu-latest
    outputs:
      blocked: ${{ steps.check.outputs.blocked }}
    steps:
      - name: Block 2-3 PM IST window
        id: check
        run: |
          IST_HOUR=$(TZ=Asia/Kolkata date +%H)
          if [ "$IST_HOUR" = "14" ]; then
            echo "blocked=true" >> "$GITHUB_OUTPUT"
            echo "Infra stop is blocked between 2:00 PM and 3:00 PM IST."
          else
            echo "blocked=false" >> "$GITHUB_OUTPUT"
          fi

  stop-infra:
    needs: time-guard
    if: ${{ needs.time-guard.outputs.blocked != 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Stop EC2
        run: |
          aws ec2 stop-instances \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }}

      - name: Stop RDS
        run: |
          aws rds stop-db-instance \
            --db-instance-identifier ${{ secrets.RDS_INSTANCE_ID }}
