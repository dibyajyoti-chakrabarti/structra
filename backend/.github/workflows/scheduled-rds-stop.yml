name: Scheduled - Auto Stop RDS if Running

on:
  schedule:
    - cron: '0 0,6,12,18 * * *'  # 00:00, 06:00, 12:00, 18:00 UTC
  workflow_dispatch:  # keep manual trigger for testing

jobs:
  auto-stop-rds:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Check RDS status and stop if running
        run: |
          STATUS=$(aws rds describe-db-instances \
            --db-instance-identifier ${{ secrets.RDS_INSTANCE_ID }} \
            --query "DBInstances[0].DBInstanceStatus" \
            --output text)

          echo "RDS status: $STATUS"

          if [ "$STATUS" = "available" ]; then
            echo "RDS is running. Stopping..."
            aws rds stop-db-instance \
              --db-instance-identifier ${{ secrets.RDS_INSTANCE_ID }}
            echo "Stop command issued."
          else
            echo "RDS is not running (status: $STATUS). No action needed."
          fi